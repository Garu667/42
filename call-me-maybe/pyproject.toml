[project]
name = "call-me-maybe"
version = "1.0.0"
description = "Constrained decoding for function calling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "pydantic",
    "numpy",
    "flake8",
    "mypy",
]

[tool.mypy]
mypy_path = "llm_sdk"

[[tool.mypy.overrides]]
module = [
    "torch",
    "transformers",
    "huggingface_hub",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "llm_sdk.*"
ignore_errors = true

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }